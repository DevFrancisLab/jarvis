[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DevFrancisLab", email = "francmaki14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=11,<19",
    "faster-whisper>=1.2.1",
    "livekit-agents>=1.8.6",
    "livekit-plugins-openai>=1.8.6",
    "noisereduce>=3.0.3",
    "piper-tts>=1.8.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "torch>=2.14.1",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
